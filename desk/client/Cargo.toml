[package]
name = "lolidesk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lolidesk 客户端：GUI（egui）和 TUI，连 lolinet 内网里的 lolidesk-host"

[[bin]]
name = "lolidesk"
path = "src/main.rs"

[dependencies]
lolidesk-proto.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
alacritty_terminal.workspace = true
crossterm = "0.29"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "system_fonts", "x11", "wayland"] }
egui = "0.37"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFString", "CFNumber", "CFArray", "CFBase"] }
objc2-core-media = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer", "CVBuffer", "CVImageBuffer", "CVReturn", "CVBase"] }
objc2-video-toolbox = { version = "0.3.2", features = ["VTDecompressionSession", "VTDecompressionProperties", "VTErrors", "VTBase", "VTSession", "objc2-core-media", "objc2-core-video"] }
