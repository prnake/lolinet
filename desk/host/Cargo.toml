[package]
name = "lolidesk-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lolidesk 主机端：PTY 终端会话 + 远程桌面（ScreenCaptureKit → VideoToolbox → QUIC）"

[dependencies]
lolidesk-proto.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rcgen.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
dirs.workspace = true
alacritty_terminal.workspace = true
portable-pty = "0.9"
if-addrs = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1.2", features = ["macos_15_0"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFString", "CFNumber", "CFArray", "CFBase", "CFCGTypes"] }
objc2-core-media = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer", "CVBuffer", "CVImageBuffer", "CVReturn", "CVBase"] }
objc2-video-toolbox = { version = "0.3.2", features = ["VTCompressionSession", "VTCompressionProperties", "VTErrors", "VTBase", "VTSession", "objc2-core-media", "objc2-core-video"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGEvent", "CGEventTypes", "CGEventSource", "CGDirectDisplay", "CGRemoteOperation", "CGGeometry", "CGWindow"] }
