# lolidesk（desk/，Rust 工作区）：编 lolidesk（一个程序：lolidesk host 让这台能被连，lolidesk <主机> 连别人）和图形客户端（GPUI）：
# macOS 上装成 Lolidesk.app（包里也带着 lolidesk），Linux 上是包根目录的 lolidesk-app（旁边是 lolidesk.desktop 和图标）。
# 和 lolinet 同样四个平台：macOS arm64 / x86_64、Linux x86_64 / arm64（Linux 的主机没有采屏，Linux 的图形客户端还看不了远程桌面）。
# 终端两端都用 libghostty-vt（运行时载入），版本钉在 desk/ghostty/libghostty-vt.json，由 desk/scripts/fetch-ghostty.sh 取。
# 独立发包，不编进 lolinet：lolinet 保持小体积的静态二进制（build.yml 的 Verify 会查）。
# PR 和 main 上都跑：fmt、clippy、测试、编译，再在回环上实跑终端会话（含主机重启后会话带着历史回来）；产物是 artifact。
# 推到 main 编过了就自动发一个 lolidesk-<版本> 的 GitHub Release（带清单 lolidesk.json；这个 tag 已经有了就跳过），
# 再用 dist.yml 原样同步到准入站 dl/。main 上只改了 .md 不跑，免得发一版内容没变的。在 main 上手动运行并勾 release 也发，用来补发。
# 它不能占 latest：设备按 releases/latest 找 lolinet.json，别的 Release 抢了 latest 会让自动升级找不到清单。
# 设备上装了的 lolidesk 由 lolinet upgrade 按 lolidesk.json 更新，比的是 --version：编译时 LOLIDESK_VERSION 设成 git describe。
name: desk

on:
  push:
    branches: [main]
    paths: [desk/**, "!desk/**/*.md", .github/workflows/desk.yml]
  pull_request:
    paths: [desk/**, .github/workflows/desk.yml]
  workflow_dispatch:
    inputs:
      release:
        description: 发一个 GitHub Release（tag lolidesk-<版本>，不占 latest），只在 main 上生效；推到 main 时会自动发
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-aarch64, os: macos-15, target: aarch64-apple-darwin, native: true }
          - { name: macos-x86_64, os: macos-15, target: x86_64-apple-darwin, native: false }
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, native: true }
          # GitHub 的 arm64 Linux runner（公开仓库免费），本机编，测试和冒烟测试都跑
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, native: true }
    steps:
      - uses: actions/checkout@v5
      # 采屏库带的 Metal 桥接（Swift）要 macOS 26 SDK；macos-15 镜像默认的 Xcode 16.4 编不过，换镜像里的 Xcode 26
      - name: Select Xcode 26
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk
          key: ${{ matrix.target }}
      # Linux 上的图形客户端（GPUI）要的系统库：键盘（xkbcommon）、X11（xcb）、Wayland、字体（fontconfig、freetype）、Vulkan。
      # 测试里的快照用 Mesa 的软件 Vulkan（lavapipe）离屏画；再装一个小的中文字体，快照里的中文才看得见
      - name: Linux packages (GPUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev mesa-vulkan-drivers fonts-wqy-microhei
      # 终端核心：按目标平台取钉住的 libghostty-vt（测试、冒烟测试和打包都用它）
      - name: libghostty-vt
        working-directory: desk
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) P=darwin-arm64; LIB=libghostty-vt.dylib ;;
            x86_64-apple-darwin) P=darwin-amd64; LIB=libghostty-vt.dylib ;;
            x86_64-unknown-linux-gnu) P=linux-amd64; LIB=libghostty-vt.so ;;
            aarch64-unknown-linux-gnu) P=linux-arm64; LIB=libghostty-vt.so ;;
          esac
          sh scripts/fetch-ghostty.sh $P "$PWD/.ghostty"
          echo "GHOSTTY_LIB=$PWD/.ghostty/$LIB" >> "$GITHUB_ENV"
          echo "LOLIDESK_GHOSTTY_VT=$PWD/.ghostty/$LIB" >> "$GITHUB_ENV"

      - name: fmt + clippy
        working-directory: desk
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      # 快照测试（lolidesk-app 的 tests/snapshots.rs）在 macOS 和 Linux 上都跑；Linux 上把画出来的 PNG 传上来看
      - name: Test
        if: matrix.native
        working-directory: desk
        run: |
          [ "${{ runner.os }}" = Linux ] && export LOLIDESK_SNAPSHOTS=$PWD/snapshots
          # pair_live：真的主机（这个 lolidesk）、真的网络，app 的模型连上本机、设备请求配对、按同意、访问页里有它
          cargo build --locked -p lolidesk --target ${{ matrix.target }}
          export LOLIDESK_BIN=$PWD/target/${{ matrix.target }}/debug/lolidesk
          cargo test --locked --workspace --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v5
        if: runner.os == 'Linux' && matrix.native
        with:
          name: lolidesk-snapshots-${{ matrix.name }}
          path: desk/snapshots/*.png
          if-no-files-found: warn

      - name: Build
        working-directory: desk
        run: LOLIDESK_VERSION=$(git describe --always) cargo build --locked --release --workspace --target ${{ matrix.target }}

      # 图形客户端：上面的 cargo build 已经编了 lolidesk-app，这里装成 Lolidesk.app（带 libghostty-vt，ad-hoc 签名）
      - name: App (Lolidesk.app)
        if: runner.os == 'macOS'
        working-directory: desk
        run: |
          V=$(git describe --always)
          # mihomo（版本和 sha256 钉在 desk/mihomo/mihomo.json）：lolinet mihomo on 用 app 里带的这份
          case "${{ matrix.target }}" in aarch64-*) MP=darwin-arm64 ;; *) MP=darwin-amd64 ;; esac
          export MIHOMO=$(sh scripts/fetch-mihomo.sh $MP "$PWD/.mihomo")
          sh scripts/bundle-app.sh target/${{ matrix.target }}/release/lolidesk-app target/${{ matrix.target }}/release/lolidesk "$GHOSTTY_LIB" app-out "$V"
          du -sh app-out/Lolidesk.app && ls -l app-out/Lolidesk.app/Contents/MacOS app-out/Lolidesk.app/Contents/Helpers app-out/Lolidesk.app/Contents/Frameworks
          cat app-out/Lolidesk.app/Contents/Resources/mihomo-NOTICE.txt
          # 跑得动的话（本机架构）看一眼确实是 mihomo
          app-out/Lolidesk.app/Contents/Helpers/mihomo -v 2>/dev/null | head -1 || true
          echo "APP=app-out/Lolidesk.app" >> "$GITHUB_ENV"

      - name: Package
        working-directory: desk
        run: |
          OS=$([ "${{ runner.os }}" = macOS ] && echo macos || echo linux)
          ARCH=$(echo ${{ matrix.target }} | cut -d- -f1)
          mkdir -p pkg
          cp target/${{ matrix.target }}/release/lolidesk "$GHOSTTY_LIB" pkg/
          printf 'lolidesk %s\ntarget %s\nbuilt from %s@%s run %s\n' "$(git describe --always)" "${{ matrix.target }}" \
            "${{ github.repository }}" "${{ github.sha }}" "${{ github.run_number }}" > pkg/BUILD-INFO
          # 和 lolinet 的包同一种格式：tar 根目录直接是二进制，libghostty-vt 放在旁边（主机从可执行文件旁边载入）；
          # macOS 的包里多一个 Lolidesk.app，Linux 的包里多 lolidesk-app、lolidesk.desktop、lolidesk.svg（见 scripts/bundle-linux.sh）
          FILES="lolidesk $(basename "$GHOSTTY_LIB") BUILD-INFO"
          if [ -n "${APP:-}" ]; then cp -R "$APP" pkg/ && FILES="$FILES Lolidesk.app"; fi
          if [ "${{ runner.os }}" = Linux ]; then
            sh scripts/bundle-linux.sh target/${{ matrix.target }}/release/lolidesk-app pkg
            FILES="$FILES lolidesk-app lolidesk.desktop lolidesk.svg"
            # 图形客户端动态链接的系统库都要找得到（Linux 桌面上都有：xkbcommon、xcb、wayland、fontconfig、freetype）
            ldd pkg/lolidesk-app | tee ldd.out
            if grep -q 'not found' ldd.out; then echo "lolidesk-app 有找不到的库"; exit 1; fi
          fi
          COPYFILE_DISABLE=1 tar -czf lolidesk-$OS-$ARCH.tar.gz -C pkg $FILES
          ls -l pkg && shasum -a 256 lolidesk-$OS-$ARCH.tar.gz

      # 回环上起主机，客户端（TUI，stdin 是管道）开一个会话、跑一条命令、退出 shell。
      # 回显里只有 $((6*7))，输出里出现 42 说明命令真的在主机的 PTY 里跑了、字节也回到了客户端。
      # 远程桌面测不了：runner 没有屏幕录制权限。交叉编译的产物 runner 跑得动（Rosetta）就也测。
      - name: Smoke test (loopback terminal session)
        working-directory: desk
        timeout-minutes: 3
        run: |
          file pkg/lolidesk
          if ! ./pkg/lolidesk --version >/dev/null 2>&1; then
            ${{ matrix.native }} && { ./pkg/lolidesk --version; exit 1; }
            echo "这台 runner 跑不了 ${{ matrix.target }}，跳过"; exit 0
          fi
          # --version 要是包的版本（BUILD-INFO 第一行）：lolinet upgrade 靠它判断要不要换
          [ "$(./pkg/lolidesk --version)" = "lolidesk $(git describe --always)" ] || { ./pkg/lolidesk --version; echo "lolidesk --version 不是 $(git describe --always)"; exit 1; }
          # 老名字：叫 lolidesk-host 时就是 lolidesk host（老的 LaunchAgent 跑 lolidesk-host run）
          ln -sf lolidesk pkg/lolidesk-host && ./pkg/lolidesk-host --help | grep -q token && rm pkg/lolidesk-host
          TOKEN=$(./pkg/lolidesk host token | awk '/^token/{print $2}')
          SHELL=/bin/bash ./pkg/lolidesk host run --listen 127.0.0.1:10190 > host.log 2>&1 &
          HOST=$!
          sleep 2
          ( sleep 2; printf 'echo HELLO-$((6*7))\n'; sleep 2; printf 'exit\n'; sleep 2 ) \
            | ./pkg/lolidesk 127.0.0.1 --token "$TOKEN" --tui -y > term.out 2> term.err || { cat term.err host.log; exit 1; }
          grep -a -q 'HELLO-42' term.out || { cat term.err host.log; echo "终端输出里没有 HELLO-42"; exit 1; }
          # 错的 token 必须被拒
          if ./pkg/lolidesk 127.0.0.1 --token 00000000 --sessions -y >/dev/null 2>&1; then echo "错的 token 没被拒"; exit 1; fi
          ./pkg/lolidesk 127.0.0.1 --sessions
          # 窗口列表是后加的请求，在单独一条控制流上问（runner 没有屏幕录制权限时主机回错，不弹框）；
          # 问完主控制流照常：后面的 --launchers 要列得出来
          ./pkg/lolidesk 127.0.0.1 --windows --launchers | tee windows.out
          grep -q '终端' windows.out || { cat windows.out host.log; echo "问过窗口之后控制流不对"; exit 1; }
          # 会话存盘：开一个会话、跑条命令、断开；主机收到 SIGTERM 会存盘，重启后会话带着历史回来
          ( sleep 2; printf 'echo MARK-$((20+22))\n'; sleep 2; printf '\035' ) | ./pkg/lolidesk 127.0.0.1 > /dev/null 2>&1 || true
          ID=$(./pkg/lolidesk 127.0.0.1 --sessions | awk -F'\t' '/^#/{sub("#","",$1); print $1}' | tail -1)
          [ -n "$ID" ] || { cat host.log; echo "断开后会话没留在主机上"; exit 1; }
          kill $HOST; wait $HOST || true
          SHELL=/bin/bash ./pkg/lolidesk host run --listen 127.0.0.1:10190 >> host.log 2>&1 &
          HOST=$!
          sleep 2
          ./pkg/lolidesk 127.0.0.1 --sessions | tee sessions.out
          grep -q '恢复的' sessions.out || { cat host.log; echo "主机重启后会话没恢复"; exit 1; }
          ( sleep 3; printf '\035' ) | ./pkg/lolidesk 127.0.0.1 -s "$ID" > restored.out 2>&1 || true
          grep -a -q 'MARK-42' restored.out || { cat host.log; echo "恢复的会话里没有之前的输出"; exit 1; }
          # computer use 的 MCP 服务（不截图、不注入：runner 没有屏幕录制权限，也不该往 runner 上敲键）：
          # 握手、9 个工具；主机 allow cua off 之后工具调用要被拒
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | ./pkg/lolidesk mcp 127.0.0.1 > mcp.out
          python3 -c 'import json,sys; m=[json.loads(l) for l in open("mcp.out")]; assert m[0]["result"]["serverInfo"]["name"]=="lolidesk"; assert len(m[1]["result"]["tools"])==9, m' \
            || { cat mcp.out host.log; echo "MCP 握手或工具列表不对"; exit 1; }
          ./pkg/lolidesk host allow cua off
          # 不给主机：这台电脑自己的主机，以主人身份连（不用配对、不用 token）
          printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"cursor","arguments":{}}}' | ./pkg/lolidesk mcp > mcp-off.out
          grep -q '没开放 computer use' mcp-off.out || { cat mcp-off.out; echo "关掉 cua 之后工具没被拒"; exit 1; }
          ./pkg/lolidesk host allow cua on
          kill $HOST
          # 配对：配对码 / 分享链接、请求同意（同意、拒绝、冷却）、设备发分享链接、按设备限制、吊销连带、老 token
          # （自己起一台主机，几台「设备」各用自己的 HOME；不弹系统对话框）
          python3 scripts/check_pairing.py ./pkg/lolidesk

      - uses: actions/upload-artifact@v5
        with:
          name: lolidesk-${{ matrix.name }}
          path: desk/lolidesk-*.tar.gz
          if-no-files-found: error

  # 推到 main 自动发；手动运行要勾 release。PR 不发
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: lolidesk-*
          path: out
          merge-multiple: true
      # lolidesk.json：四个平台包的 sha256 和版本（BUILD-INFO 第一行），四个都要在、版本一致
      - name: Manifest
        run: python3 lolinet/release.py --lolidesk out
      - name: GitHub Release
        id: release
        run: |
          V=$(python3 -c 'import json; print(json.load(open("out/lolidesk.json"))["version"])')
          TAG="lolidesk-$V"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 同一个提交重跑（或者先手动发过）就不再发；准入站照样再同步一次
          if gh release view "$TAG" >/dev/null 2>&1; then echo "已经有 ${TAG}，跳过"; exit 0; fi
          (cd out && for f in lolidesk-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          BEFORE=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          gh release create "$TAG" out/*.tar.gz out/*.sha256 out/SHA256SUMS out/lolidesk.json --target "$GITHUB_SHA" --latest=false --title "lolidesk $V" \
            --notes "lolidesk ${V}：lolidesk（一个程序：lolidesk host 让这台电脑能被连，lolidesk <主机> 连别人）和终端核心 libghostty-vt。macOS 的包里还有图形客户端 Lolidesk.app（ad-hoc 签名，第一次打开要右键 → 打开）；Linux 的包里是 lolidesk-app（解开后直接跑，远程桌面还看不了）。macOS arm64 / x86_64、Linux x86_64 / arm64（Linux 的主机只有终端）。独立发包，不编进 lolinet。"
          # releases/latest 还得是 lolinet 的那一版
          AFTER=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          [ "$AFTER" = "$BEFORE" ] || { echo "releases/latest 从 ${BEFORE:-无} 变成了 $AFTER"; exit 1; }

  # 同一版的文件传到准入站 dl/（没配 Cloudflare 的 secret 就跳过，见 dist.yml）
  dist:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/dist.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
